# Progetto Xcode generato con XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Uso: brew install xcodegen && xcodegen generate
name: MyWardrobeAI
options:
  bundleIdPrefix: com.mywardrobe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Inserisci qui il tuo Team ID Apple (vedi README, sezione "Aprire e compilare").
    DEVELOPMENT_TEAM: ""
targets:
  MyWardrobeAI:
    type: application
    platform: iOS
    sources:
      - path: MyWardrobeAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mywardrobe.ai
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MyWardrobe AI
        # Icona in Assets.xcassets/AppIcon.appiconset (1024×1024, senza trasparenza).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "MyWardrobe AI usa la fotocamera per fotografare i tuoi capi. Le foto restano sul tuo iPhone."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "La posizione serve solo a leggere il meteo, se decidi di attivarlo. Non viene salvata."
        ENABLE_PREVIEWS: YES
  MyWardrobeAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MyWardrobeAITests
    dependencies:
      - target: MyWardrobeAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mywardrobe.ai.tests
        GENERATE_INFOPLIST_FILE: YES
        # I test girano dentro l'app, così vedono il codice di MyWardrobeAI (@testable import).
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MyWardrobeAI.app/MyWardrobeAI"
        BUNDLE_LOADER: "$(TEST_HOST)"
